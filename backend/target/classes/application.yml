spring:
  datasource:
    url: jdbc:mysql://localhost:3306/manajemen_ruangan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update       # pakai Flyway untuk semua perubahan schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:ganti-dengan-secret-minimal-256-bit-yang-panjang-sekali-ini-harus-diubah-nanti}
    expiration: 86400000       # 24 jam

server:
  port: 8080
